name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run frontend tests
        run: node --test tests/*.test.js

      - name: Check frontend syntax
        run: |
          node --check functions.js
          node --check game-engine.js
          node --check leaderboard-api.js
          node --check scripts/prepare-pages.mjs

      - name: Stage frontend with configured API origin
        env:
          ARCADE_API_BASE_URL: ${{ vars.ARCADE_API_BASE_URL }}
        run: node scripts/prepare-pages.mjs pages-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend-only artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
