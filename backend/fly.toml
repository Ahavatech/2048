# Do not reuse this volume for concurrent writer machines; this SQLite setup
# is for one active machine.
app = "2048"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/2048.db"
  RATE_LIMIT_WINDOW_MS = "60000"
  RATE_LIMIT_MAX = "100"
  TRUST_PROXY_HOPS = "1"
  CORS_ORIGINS = "https://ahavatech.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
